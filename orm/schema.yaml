title: OCI AI Gateway
description: Use optional OCI Generative AI, Anthropic and OpenAI models through one gateway on OCI.
schemaVersion: 1.1.0
version: "1.0"
locale: en
instructions: Enable at least one provider. Select saved secrets for external providers to reuse keys automatically. If left blank, save keys using the output links after Apply. Check deployment status, then use the generated presenter password. Apply success does not mean Ready.
variableGroups:
  - title: Deployment
    variables: ["${compartment_ocid}", "${deployment_id}", "${availability_domain}", "${image_ocid}", "${presenter_email}"]
  - title: Optional model providers
    variables: ["${enable_oci}", "${oci_model_id}", "${inference_region}", "${enable_anthropic}", "${anthropic_model_id}", "${anthropic_secret_ocid}", "${enable_openai}", "${openai_model_id}", "${openai_secret_ocid}"]
  - title: Capacity
    variables: ["${instance_shape}", "${instance_ocpus}", "${instance_memory_gbs}"]
  - title: Verification
    variables: ["${verification_run}"]
variables:
  tenancy_ocid: {type: string, visible: false}
  region: {type: string, visible: false}
  compartment_ocid:
    type: oci:identity:compartment:id
    title: Deployment compartment
    required: true
  deployment_id:
    type: string
    title: Unique deployment name
    pattern: "^[a-z][a-z0-9-]{2,39}$"
    required: true
  availability_domain:
    type: oci:identity:availabilitydomain:name
    title: Availability domain
    required: true
    dependsOn: {compartmentId: "${compartment_ocid}"}
  image_ocid:
    type: oci:core:image:id
    title: Ubuntu 24.04 AMD image
    description: Choose a Canonical-Ubuntu-24.04 image without an aarch64 suffix. Keep this selection on later Applies.
    required: true
    dependsOn:
      compartmentId: "${compartment_ocid}"
      shape: "${instance_shape}"
      operatingSystem: Canonical Ubuntu
      operatingSystemVersion: "24.04"
  presenter_email: {type: string, title: Presenter username, required: true}
  enable_oci: {type: boolean, title: Enable OCI Generative AI, required: true}
  enable_anthropic: {type: boolean, title: Enable Anthropic (optional API key), required: true}
  enable_openai: {type: boolean, title: Enable OpenAI (optional API key), required: true}
  oci_model_id:
    type: string
    title: OCI Chat model
    description: Must be available to your tenancy in the inference region; availability differs by region.
    required: true
    visible: ${enable_oci}
  inference_region:
    type: string
    title: Inference region (optional)
    description: Leave blank to use the hosting region. A different region must already be subscribed.
    visible: ${enable_oci}
  anthropic_model_id: {type: string, title: Anthropic model, required: true, visible: "${enable_anthropic}"}
  openai_model_id: {type: string, title: OpenAI model, required: true, visible: "${enable_openai}"}
  anthropic_secret_ocid:
    type: oci:kms:secret:id
    title: Saved Anthropic key (optional)
    description: Select a shared Vault secret in this compartment and hosting region. It remains independently owned. Leave blank to create a secret and enter the key after Apply. Keep this selection unchanged on later Applies.
    required: false
    visible: ${enable_anthropic}
    dependsOn: {compartmentId: "${compartment_ocid}"}
  openai_secret_ocid:
    type: oci:kms:secret:id
    title: Saved OpenAI key (optional)
    description: Select a shared Vault secret in this compartment and hosting region. It remains independently owned. Leave blank to create a secret and enter the key after Apply. Keep this selection unchanged on later Applies.
    required: false
    visible: ${enable_openai}
    dependsOn: {compartmentId: "${compartment_ocid}"}
  instance_shape:
    type: enum
    title: VM shape
    enum: [VM.Standard.E4.Flex, VM.Standard.E5.Flex]
    required: true
  instance_ocpus: {type: number, title: OCPUs, minimum: 1, maximum: 16, required: true}
  instance_memory_gbs: {type: number, title: Memory (GB), minimum: 8, maximum: 256, required: true}
  verification_run:
    type: number
    title: Verification run
    description: Start at 1. Increase and Apply to retry samples or activate a corrected key. Never decrease. Maximum 20 runs per deployment.
    minimum: 1
    maximum: 20
    required: true
outputs:
  anthropic_key_secret_url: {type: link, title: Optional Anthropic credentials, displayText: Anthropic key secret}
  openai_key_secret_url: {type: link, title: Optional OpenAI credentials, displayText: OpenAI key secret}
  presenter_password_secret_url: {type: link, title: Presenter credentials, displayText: View presenter password}
  status_url: {type: link, title: Deployment status, displayText: Check last verification}
  compare_url: {type: link, title: LiteLLM Compare, displayText: Open Compare}
  presenter_username: {type: copyableString, title: Presenter username}
primaryOutputButton: ${status_url}
